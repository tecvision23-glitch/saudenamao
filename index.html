<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde na Mão-MZ | Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
        
        /* Cabeçalho */
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Área das Mensagens */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 15px; position: relative; }
        
        /* Estilo da IA (Saúde na Mão-MZ) */
        .bot { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        /* Estilo do Utilizador */
        .user { align-self: flex-end; background: #dcf8c6; color: #333; border-bottom-right-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Barra de Digitação */
        .input-area { background: white; padding: 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        
        input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 16px; }
        
        button { background: #075e54; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #128c7e; }
    </style>
</head>
<body>

<div class="header">Saúde na Mão-MZ</div>

<div id="chat-container">
    <div class="message bot">Olá! Eu sou o Saúde na Mão-MZ, o seu guia digital para o bem-estar em Moçambique. Estou aqui para tirar dúvidas sobre saúde, ajudar a entender sintomas ou dar dicas de prevenção.</div>
</div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Escreva a sua dúvida aqui..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Enviar</button>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        const text = input.value.trim();
        
        if (!text) return;

        // Adiciona a mensagem do utilizador ao ecrã
        container.innerHTML += <div class="message user">${text}</div>;
        input.value = '';
        container.scrollTop = container.scrollHeight;

        try {
            // Liga ao seu Ollama local
            const response = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                body: JSON.stringify({
                    model: 'saude-mz',
                    prompt: text,
                    stream: false
                })
            });

            const data = await response.json();
            
            // Adiciona a resposta da IA ao ecrã
            container.innerHTML += <div class="message bot">${data.response}</div>;
            container.scrollTop = container.scrollHeight;
        } catch (error) {
            container.innerHTML += <div class="message bot">⚠️ Erro: Certifique-se de que o Ollama está ligado no terminal.</div>;
        }
    }
</script>

</body>
</html>
