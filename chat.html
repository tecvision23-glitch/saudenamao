<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. IA | Saúde na Mão-MZ</title>
    <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai@0.1.0/dist/index.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 10px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: white; margin-right: 10px; overflow: hidden; border: 2px solid #fff; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 15px; }
        .bot { background: white; align-self: flex-start; }
        .user { background: #dcf8c6; align-self: flex-end; }
        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div class="avatar">
        <!-- LINK DE IMAGEM REAL - VERIFIQUE SE ESTÁ ASSIM -->
        <img src="https://img.freepik.com/fotos-gratis/retrato-de-um-medico-sorridente-em-seu-escritorio_23-2148302302.jpg" alt="Doutor">
    </div>
    <div>
        <div style="font-weight: bold;">Dr. IA - Triagem Profissional</div>
        <div style="font-size: 11px; color: #dcf8c6;">● Online agora</div>
    </div>
</div>

<div id="chat-container">
    <div class="msg bot">Olá, Américo. Como posso ajudar com a sua saúde hoje?</div>
</div>

<div class="input-area">
    <input type="text" id="campoMensagem" placeholder="Escreva aqui...">
    <button onclick="executarChat()">Enviar</button>
</div>

<script>
    // ⚠️ COLOQUE SUA CHAVE AIza... AQUI DENTRO DAS ASPAS
    const CHAVE_GEMINI = "COLOQUE_SUA_CHAVE_AQUI"; 

    async function executarChat() {
        const input = document.getElementById('campoMensagem');
        const mural = document.getElementById('chat-container');
        const prompt = input.value.trim();

        if (prompt === "") return;

        mural.innerHTML += <div class="msg user">${prompt}</div>;
        input.value = "";
        mural.scrollTop = mural.scrollHeight;

        try {
            const genAI = new window.GoogleGenerativeAi.GoogleGenerativeAI(CHAVE_GEMINI);
            const model = genAI.getGenerativeModel({ model: "gemini-pro" });
            const result = await model.generateContent("Responda como um médico moçambicano: " + prompt);
            const response = await result.response;
            mural.innerHTML += <div class="msg bot">${response.text()}</div>;
        } catch (e) {
            mural.innerHTML += <div class="msg bot" style="color:red;">Erro: Verifique sua chave de API ou conexão.</div>;
        }
        mural.scrollTop = mural.scrollHeight;
    }
</script>
</body>
</html>
