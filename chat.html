<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Saúde na Mão-MZ | Triagem</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #128c7e; color: white; padding: 15px; display: flex; align-items: center; gap: 10px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 10px; max-width: 80%; line-height: 1.5; }
        .user { align-self: flex-end; background: #dcf8c6; }
        .bot { align-self: flex-start; background: white; border-left: 5px solid #007bff; }
        #input-area { padding: 15px; background: #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        button { background: #128c7e; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 30px;">👨‍⚕️</div>
        <div><strong>Saúde na Mão-MZ</strong><br><small>Assistente de Triagem</small></div>
    </header>
    <div id="chat">
        <div class="msg bot"><b>Dr. Saúde:</b> Olá! Sou o seu assistente em Moçambique. Descreva os seus sintomas para começarmos a triagem.</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-in" placeholder="Ex: Sinto dor de cabeça...">
        <button onclick="enviar()">➤</button>
    </div>
    <script>
        async function enviar() {
            const campo = document.getElementById('user-in');
            const mural = document.getElementById('chat');
            const texto = campo.value.trim();
            if(!texto) return;

            mural.innerHTML += `<div class="msg user">${texto}</div>`;
            campo.value = '';

            try {
                const res = await fetch('http://127.0.0.1:11434/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        model: 'saude-mz',
                        messages: [{role: 'user', content: texto}],
                        stream: false
                    })
                });
                const data = await res.json();
                mural.innerHTML += `<div class="msg bot"><b>Dr. Saúde:</b> ${data.message.content.replace(/\n/g, '<br>')}</div>`;
            } catch(e) {
                mural.innerHTML += `<div class="msg bot" style="color:red;"><b>Erro:</b> Não consegui conectar ao Ollama. Verifique o terminal!</div>`;
            }
            mural.scrollTop = mural.scrollHeight;
        }
    </script>
</body>
</html>
