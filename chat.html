<!DOCTYPE html>
<html lang="pt-MZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. IA | Saúde na Mão-MZ</title>
    <!-- Versão estável da biblioteca Google IA -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 12px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: white; margin-right: 12px; overflow: hidden; border: 2px solid #fff; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 10px; font-size: 15px; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
        .user { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 16px; }
        button { background: #075e54; color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div class="avatar">
        <!-- Imagem do Doutor Real Retificada -->
        <img src="https://img.freepik.com/fotos-gratis/retrato-de-um-medico-sorridente-em-seu-escritorio_23-2148302302.jpg" alt="Doutor">
    </div>
    <div>
        <div style="font-weight: bold;">Dr. IA - Triagem Profissional</div>
        <div style="font-size: 11px; color: #dcf8c6;">● Online agora</div>
    </div>
</div>

<div id="chat-window">
    <div class="msg bot">Olá! Sou o Dr. IA do Saúde na Mão-MZ. Como posso ajudar com a sua saúde hoje?</div>
</div>

<div class="input-bar">
    <input type="text" id="textoUsuario" placeholder="Descreva os seus sintomas...">
    <button id="btnEnviar">Enviar</button>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // ⚠️ ATENÇÃO: COLA A TUA CHAVE DENTRO DAS ASPAS ABAIXO
    const API_KEY = "COLOQUE_AQUI_A_TUA_API_KEY"; 

    const btn = document.getElementById('btnEnviar');
    const input = document.getElementById('textoUsuario');
    const mural = document.getElementById('chat-window');

    async function conversar() {
        const mensagem = input.value.trim();
        if (!mensagem) return;

        // 1. Mostrar mensagem do utilizador
        mural.innerHTML += <div class="msg user">${mensagem}</div>;
        input.value = "";
        mural.scrollTop = mural.scrollHeight;

        try {
            const genAI = new GoogleGenerativeAI(API_KEY);
            const model = genAI.getGenerativeModel({ model: "gemini-pro" });
            
            // 2. Chamar a IA
            const result = await model.generateContent("Aja como um médico de Moçambique atencioso. Pergunta: " + mensagem);
            const response = await result.response;
            const textoIA = response.text();

            // 3. Mostrar resposta
            mural.innerHTML += <div class="msg bot">${textoIA}</div>;
        } catch (error) {
            console.error(error);
            mural.innerHTML += <div class="msg bot" style="color: red;">Ocorreu um erro na conexão. Verifique a sua chave API.</div>;
        }
        mural.scrollTop = mural.scrollHeight;
    }

    // Ligar o clique do botão à função
    btn.onclick = conversar;

    // Permitir enviar com a tecla Enter
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') conversar(); });
</script>

</body>
</html>
